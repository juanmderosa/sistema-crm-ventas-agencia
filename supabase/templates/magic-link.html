<!doctype html>
<html lang="es">
  <body>
    <h1>Invitación de agencia</h1>
    <p>
      Recibiste una invitación para trabajar en una agencia. Tu contraseña
      actual se conserva.
    </p>
    <p>
      <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}"
        >Revisar y aceptar invitación</a
      >
    </p>
    <p>
      El enlace vence en una hora. Si no esperabas esta invitación, podés
      ignorarlo.
    </p>
  </body>
</html>
